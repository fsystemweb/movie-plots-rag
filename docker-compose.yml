# Local Qdrant and the MCP server. Keep the Qdrant image tag in sync with .github/workflows/ci.yml.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: movie-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but not curl: probe /readyz over a raw TCP socket.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mcp-server:
    build: .
    container_name: movie-rag-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP__HOST: 0.0.0.0 # listen on all interfaces inside the container
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
    ports:
      - "8000:8000" # streamable HTTP at /mcp (mcp.port in config.yaml)
    volumes:
      - fastembed_models:/models
    healthcheck:
      test: [CMD, python, -m, movie_rag.mcp_server, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  qdrant_storage:
  fastembed_models:
