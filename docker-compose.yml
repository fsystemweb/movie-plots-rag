# Local Qdrant. Keep the image tag in sync with .github/workflows/ci.yml.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: movie-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships bash but not curl: probe /readyz over a raw TCP socket.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  qdrant_storage:
