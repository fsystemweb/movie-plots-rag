  - premise: "{n}, a ferry pilot on a lake that is slowly drying up, is ordered to make the last scheduled crossing with a single passenger."
    obj: "the last crossing"
    turn: "The passenger is {a}, who built the dam that drained the lake, and who asks to be taken to an island that no longer has any water around it."
  - premise: "{n}, a seamstress with a steady hand and a hidden debt, is hired to sew a wedding dress for the bride of a man {n} once loved."
