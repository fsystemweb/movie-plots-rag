    turn: "Inside the piano, {n} finds a folded score that proves {a}, a celebrated composer, never wrote the work that made a fortune."
  - premise: "{n}, a widowed shepherd, takes in an unsociable teenage boy who arrives with a suitcase of unlabelled cassette tapes."
