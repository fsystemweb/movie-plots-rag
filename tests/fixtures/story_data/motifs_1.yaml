# SYNTHETIC story motifs (part 1). Each motif is one film's core premise: who, what object is at the centre, and
# the central twist. Motifs are drawn WITHOUT replacement, so no two generated films share a premise.
# {n} is the protagonist's name, {a} a second character's name. Texts avoid pronouns so any name fits.
drama:
  - premise: "{n}, a retired cannery foreman in a town that has just lost its only factory, begins repairing the abandoned bandstand on the seafront single-handedly."
    obj: "the abandoned bandstand"
    turn: "The council offers to demolish the bandstand for free, and {a}, who once played there, asks {n} to stop before the whole town learns why."
  - premise: "{n}, a night-school teacher of forty, discovers that the oldest student in the class has been secretly learning to read in order to open a sealed letter."
    obj: "the sealed letter"
    turn: "When the letter is finally opened, it turns out to be a confession addressed to {a}, who has avoided the old man for thirty years."
  - premise: "{n}, the youngest daughter of a failing vineyard, wakes to find that a hailstorm has destroyed every grape but those on a single row of ungrafted vines."
    obj: "the ungrafted vines"
