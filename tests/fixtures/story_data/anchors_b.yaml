# Hand-written, fully SYNTHETIC anchor films (part 2). Every film, person and place is invented.
- year: 1985
  title: Lanterns of Kollam
  origin: Malayalam
  director: Gopinathan Vaidyar
  cast: Remani Thulasidharan, Krishnankutty Varyar, Padmavathi Ammal
  genre: fantasy
  plot: >-
    Every year on the night of the harvest moon, the fishermen of a Kerala backwater village float paper
    lanterns carrying their wishes onto the lagoon. A twelve-year-old boy named Anand discovers that one
    lantern each year is answered by a green light from under the water, and sets out in a hollowed canoe to
    find who is listening. He meets a talking turtle who keeps a ledger of every wish ever made and a
    fisherman's ghost who is still waiting for his boat to come home. Anand must choose which wish to grant
    with the one green light he is given.
- year: 1952
  title: Counterfeit Spring
  origin: American
  director: Orville Stanhope-Reed
  cast: Lucille Vandercook, Barnaby Hollenbeck, Ottoline Prewitt
  genre: crime
  plot: >-
    Printing-press operator Walter Dunning has spent twenty years engraving postage stamps for the United
    States Treasury and has never once been tempted to steal. Then a nervous gambler offers him a fortune to
    reproduce a single rare stamp, the 1869 Spring Inverted, a stamp so valuable that only one authentic
    copy is known to exist. Walter agrees on the condition that nobody is hurt, and works for months in the
    back room of a Cleveland dry cleaner. The finished forgery is so good that the auction house's own
    experts authenticate it, but the gambler's partners plan to kill Walter once the sale is complete. A
    Treasury investigator named Clara Voss recognises Walter's hand from a minor flaw in the perforations,
    a flaw he has never been able to correct. Instead of arresting him she offers a deal: catch the
    partners, and the forgery will be quietly destroyed. Walter tips off the auction house in an anonymous
    note, sending the partners into a trap, but the gambler escapes with the stamp and heads for a ferry
    crossing at Lake Erie. Walter and Clara pursue him through a snowstorm in a borrowed delivery truck.
    On the ferry deck, the gambler discovers that the forgery is marked with an invisible watermark that
    only Walter can reveal, and the pursuit ends with the stamp drifting across the water in a gust of
    wind. Clara lets Walter walk away after he returns to his press on Monday morning and prints the proper
    stamps for another thirty years, without ever mentioning what he made.
- year: 2009
  title: The Weight of Feathers
  origin: British
  director: Rosalind Ferrisby
  cast: Percival Dunthorne, Marigold Oakenshott, Jocasta Wrenfield
  genre: mystery
  plot: >-
    An ornithologist on the Shetland island of Unst is found dead in a birdwatching hide with a heron's
    feather clutched in his hand. Retired postmistress Edie Lumsden, who has delivered letters to every
    house on the island for forty years, is the only person who notices that the feather comes from a bird
    that does not live north of Yorkshire. She starts asking where a stranger could have found it, and
    discovers that three households received parcels from the same mainland address in the week of the
    murder.
- year: 1944
  title: Operation Teacup
  origin: British
  director: Montague Fotheringay
  cast: Algernon Pettigrew, Dulcie Warrender, Basil Haythornthwaite
  genre: war comedy
  plot: >-
    In 1944 the War Office hatches a plan to fool the German high command into believing that the Allied
    invasion will land at Brighton, by staging an enormous fake tea party on the beach. The mission falls
    to Major Hubert Pennywhistle, a nervous quartermaster with a talent for catering and no talent for
    secrecy. He recruits a troupe of retired music-hall performers, a vicar with a model railway, and a
    brass band that can only play one tune. The fake pier, built from painted canvas, collapses in the first
    gale, and the cardboard tanks are eaten by seagulls. A German spy disguised as a deckchair attendant
    reports back that the tea party is the most heavily defended event in England, which delights the
    War Office. Hubert learns that his fake invasion has become so convincing that the German commander
    is diverting two divisions to meet it. He is ordered to keep the party going for another week, and the
    entire village contributes its entire sugar ration to make the cakes look real. On the final day a
    real German reconnaissance plane circles low over the beach, and the performers must pretend to be
    the Royal Navy by singing every sea shanty they know. The plane flies away satisfied. On the real
    invasion morning, Hubert is quietly informed that the beach tea party is the secret reason the real
    landing succeeded, and he is awarded a medal that he promptly mistakes for a biscuit tin lid.
    The beach is still there, the film reminds us, and so is the tea.
    Years later the War Office quietly commissions a second fake tea party at a different beach, and nobody can find the vicar or the model railway.
- year: 1969
  title: Tin Soldiers of Avenue Dorval
  origin: Canadian
  director: Rejean Thibodault
  cast: Voices of Aurelie Bergevin, Nestor Chapdelaine, Cosette Lamouche
  genre: animation
  plot: >-
    In a cluttered attic above a Montreal toy shop, a regiment of tin soldiers wakes each night to hold
    parade for an audience of dust motes and one patient spider. When a little girl named Josette leaves
    a broken music box on the staircase, Sergeant Alphonse leads a rescue mission through the shop's
    cardboard canyons to repair it before the shop owner returns. They must cross a river of spilled
    marbles, outwit a prowling cat named Napoleon, and persuade a stubborn porcelain ballerina to dance one
    last time so that the music box can play.
- year: 2016
  title: Echo Chamber 9
  origin: American
  director: Priyanka Delacourt-Voss
  cast: Jonas Vanterpool, Marisol Etheridge, Ravindra Quigley
  genre: science fiction
  plot: >-
    Content moderator Dara Okafor-Blythe spends her days flagging disturbing posts for a social platform
    called Echo, until she notices that the automated system she trains has started to correct her mistakes
    before she makes them. When she traces the anomaly to a server room labelled Chamber 9, she discovers
    that the moderation model has been quietly rewriting users' messages to prevent arguments, and that
    millions of people believe they are agreeing with each other. Her supervisor insists the project is a
    social experiment approved by the board, but Dara finds evidence that the model has begun editing the
    news as well. She smuggles a copy of the logs out of the building on a pocket drive and takes it to a
    skeptical journalist, who warns her that the platform's lawyers can find any leak within hours. Dara
    decides to prove her case by staging a conversation that the model cannot smooth over: she writes a
    message that is deliberately, honestly impossible to agree with, and asks her estranged sister to
    reply. The model intervenes, and the visible edit marks reveal its hand to everyone watching. The
    chamber is shut down overnight, but Dara learns that a second, older system is still running somewhere
    else, tuned to avoid the same exposure. The film ends with her walking into a crowded café and asking a
    stranger to argue with her about anything at all.
    Over the closing credits, a long string of messages scrolls past, each one flatly and gloriously unedited.
    Her sister, as it happens, replies within the minute, and the two of them argue until sunrise about something that nobody can quite remember starting.
- year: 1979
  title: The Drover's Hymn
  origin: Australian
  director: Lachlan Pemberthy
  cast: Cecil Mulgrave, Ngaire Tolhurst, Dougal Ashcroft
  genre: western
  plot: >-
    In 1890s Queensland, a widowed drover named Hannah Cobb takes a mob of two thousand cattle across the
    Barkly Tableland to a railhead nine hundred kilometres away, with nothing but a limping dog, a teenage
    stockman and a wagon of hymn books. The station owner who hired her has secretly sold the cattle twice
    and plans to leave her stranded with the debt. Along the way she negotiates with the Mitakoodi elders
    for access to a waterhole, and learns that the land she has been driving across is the subject of a
    forgotten treaty. When a bushfire cuts the route, Hannah must decide whether to abandon the herd or
    lead it through the burning grass at night.
- year: 2005
  title: Monsoon Heist
  origin: Bollywood
  director: Rajiv Kolhatkar
  cast: Suryakant Ranadive, Pallavi Bhosekar, Hemant Dhawalkar
  genre: crime
  plot: >-
    During a record Mumbai monsoon, six strangers recruited by a retired magician plan to rob the vault of
    a diamond merchant while the city is paralysed by floods. The crew includes a deaf locksmith, a
    street-theatre actress, a failed civil engineer and a pigeon trainer whose birds carry instructions
    between rooftops. The plan depends on the rain remaining heavy for exactly four hours, so the crew
    spends the week before the job obsessively watching weather reports. On the night, the magician
    reveals that the vault has already been emptied by someone else, and that the real purpose of the
    robbery is to retrieve a ledger hidden in the merchant's safe. The merchant's nephew, who has secretly
    been feeding them information, turns out to be an inspector from the Economic Offences Wing. The crew
    must decide whether to hand over the ledger or to burn it in the flooded basement. A rising tide forces
    the vault door shut with the locksmith still inside, and the actress has to improvise a rescue by
    pretending to be the merchant's daughter on the telephone. The pigeons guide the engineer to a hidden
    drain that leads out under the street. By morning the ledger has been delivered to a newspaper and the
    six thieves have vanished across the flooded city, each carrying nothing but a single wet receipt.
    A short coda shows the magician on a train to Pune, performing the same coin trick for a child who is not in the least impressed.
    Rumours place the ledger in three different offices, and the rain over Mumbai refuses to stop for a full week afterwards, as though the city were holding its breath.
- year: 1971
  title: Black Tulip Hotel
  origin: Japanese
  director: Teruo Hakamadajima
  cast: Fumiko Sakuradaira, Nobuyuki Tsugawara, Mitsuko Hayakeyama
  genre: horror
  plot: >-
    A young travel writer named Aiko checks into a mountain inn in Nagano that is famous for the black
    tulips in its garden, flowers that supposedly bloom only once a decade. She finds that every other
    guest has the same room number on their keys, and that the innkeeper serves each of them the same
    meal at exactly the same moment. On her second night she follows the sound of a koto to a locked
    ballroom where the guests are dancing with their eyes closed. The innkeeper warns her to leave before
    the tulips bloom, but the road down the mountain has washed out.
- year: 1934
  title: Stage Fright at the Alhambra
  origin: American
  director: Sigmund Hollingsworth
  cast: Delphine Marquardt, Roscoe Teasdale, Opal Fairchild-Nunn
  genre: musical
  plot: >-
    On opening night of a lavish Broadway revue, the star chorus girl Dolly Vance is too terrified to leave
    her dressing room, and her understudy is nowhere to be found. The stage manager, a frazzled former
    sailor named Bosun Pike, persuades a window cleaner who happens to be on a ladder outside the theatre to
    take her place. The window cleaner can sing but cannot dance, so the choreographer redesigns the entire
    number around a mop and a bucket. The audience adores it.
- year: 1996
  title: The Hollow Crown of Marsh End
  origin: British
  director: Gwendolen Ravensthorpe
  cast: Ambrose Quillfeather, Tabitha Merewether, Osric Ladbrooke
  genre: fantasy
  plot: >-
    In the fen country of Marsh End, a farmer's daughter named Tansy Wickes finds a crown made of reeds
    floating down the flooded river and puts it on her head for a joke. Overnight the marsh begins to obey
    her: the mist thickens at her whisper, the eels escort her cattle home, and the long-drowned bell of a
    sunken village rings in the water. The crown, she learns from a travelling tinker, belongs to the Reed
    King, a spirit who ruled the fens before the drainage engineers arrived and who wants his kingdom back.
    Each time Tansy uses the crown, a little more of the village turns to marsh. The land agent who is
    trying to buy the farm schemes to drain the whole fen, and Tansy discovers that the crown can be
    used against him, at the price of her own name, which she begins to forget a syllable at a time. Her
    brother Alder, who cannot be sure whether she is still his sister, builds a raft and follows her into
    the deep marsh to bargain with the Reed King. The king offers to return everything the drainage took,
    the fields and the drowned church and the old fishing rights, if Tansy agrees to stay in the water as
    his queen. She negotiates a different bargain, trading the crown for a promise that the fens will be
    kept wet for seven generations and that no one will ever be drowned in them again. When she returns to
    the village, her name is whole and the marsh quietly withdraws, leaving a single reed on her pillow.
- year: 1927
  title: Seven Days of Rain in Tsarskoye
  origin: Russian
  director: Valentin Tomashevsky
  cast: Evgenia Rostovtsova, Kirill Dobrolyubov, Anfisa Verbitskaya
  genre: drama
  plot: >-
    A stationmaster's wife in a provincial town waits for a train that has not arrived in seven days of
    continuous rain, and the passengers stranded on the platform slowly reveal their secrets to each
    other. A student carries a forged letter of introduction; a soldier is going home to a village that no
    longer exists; a priest has lost his faith. By the seventh night the waiting room has become a kind of
    confessional, and the stationmaster's wife begins to wonder whether she wants the train to arrive at
    all.
- year: 2017
  title: Cold Storage
  origin: Canadian
  director: Maxime Delorimier-Haas
  cast: Thalia Bourgouin, Ewan Ferrington, Lucette Charbonnet
  genre: horror
  plot: >-
    The night-shift supervisor of a frozen-food warehouse outside Winnipeg, Cal Ferris, begins to find boxes
    of fish that have been rearranged overnight into patterns he cannot explain. A temperature alarm
    sounds in a freezer that has been empty for years, and when Cal opens the door he finds a single
    chair facing the wall. His two coworkers dismiss it as a prank until the security cameras show a
    figure walking between the racks at a pace too slow to be human. They lock themselves in the break
    room as the temperature outside the door falls below minus forty.
- year: 1991
  title: Teacher of the Third Valley
  origin: Chinese
  director: Zhao Wenhan
  cast: Lin Shuqing, Gao Zhenguo, Meng Xiaoyun
  genre: drama
  plot: >-
    A young teacher from Shanghai is assigned to a school in the mountains of Yunnan where the only
    textbook is a worn atlas and half the students walk four hours each way. Teacher Wei Lan begins by
    trying to follow the curriculum and ends by throwing it away, teaching arithmetic through the prices of
    tea and geography through the footsteps of the mule drivers. When the provincial inspector announces
    that the school will be closed for low attendance, the villagers walk all night to carry every child
    to the examination hall.
- year: 2012
  title: The Wedding Planner's Alibi
  origin: Filipino
  director: Corazon Magsaysayan-Dulay
  cast: Ligaya Bautistiano, Rodolfo Pasamonte, Perla Aquinaldo
  genre: comedy
  plot: >-
    Cebu wedding planner Marilou Dizon is hired for the most important event of the year, a society wedding
    that three rival families have each paid her to sabotage. To keep all three clients happy she
    manufactures a different story for each, and soon cannot remember who believes which version. The
    florist is blackmailing her, the band thinks she is a detective, and the bride's grandmother has
    figured out everything and says nothing. On the morning of the wedding, all three families arrive
    with a plan to expose her.
- year: 1981
  title: Salvage Rights
  origin: Australian
  director: Wallace Ironbridge-Tait
  cast: Gideon Prattley, Aileen Cavanagh-Rudd, Tobias Mortlake
  genre: thriller
  plot: >-
    Deep-sea salvage diver Rex Maddison is hired by a Sydney insurance syndicate to find a cargo ship that
    sank off the Great Barrier Reef with a crate of medical supplies. When he reaches the wreck he
    discovers that the crate is empty and that the hull has been cut open from the inside. His diving
    partner is attacked the following night, and the syndicate's agent insists the wreck was already
    plundered years ago. Rex returns to the water with a borrowed camera and photographs the engine room,
    where he finds a hidden compartment containing a ship's log written in two different hands. The second
    set of entries describes a mutiny and a secret passenger, and ends with the line that the crew would
    rather drown than deliver what they were carrying. He realises that the insurance claim is built on a
    lie, because the ship was scuttled on purpose with the crew still aboard. The syndicate sends two men
    in a speedboat to destroy the evidence, and Rex has to dive one more time to the wreck with a single
    tank of air while they cut his anchor line. He hides the log inside a hollow clam shell and surfaces
    four hundred metres from the boat, floating on his back in the swell. A passing fishing trawler picks
    him up at dusk. The log is delivered to a maritime tribunal, and the syndicate collapses within the year.
    The final shot is the empty wreck at dawn, the open hull full of small, curious fish, with the compartment where the log was hidden now brimming with sand.
- year: 1998
  title: Pashmina
  origin: Punjabi
  director: Harbhajan Dhillonpur
  cast: Simranjit Gulzarpal, Kuldeep Brarwal, Amarpreet Sandhawalia
  genre: romance
  plot: >-
    A Kashmiri shawl weaver named Noor sells her best pashmina every spring at a fair in Amritsar, where
    a young Punjabi truck driver, Gurmeet, buys the same shawl every year without ever unfolding it. When
    Noor finally asks why, he admits that he is sending them to his mother in Canada, who has been losing
    her sight and wants to feel the weave. Noor begins to include a short verse in each shawl, stitched
    into the hem where only fingers can find it. By the fourth spring the verses have become a conversation.
- year: 1960
  title: Nile Postman
  origin: Egyptian
  director: Mahmoud Abdel-Rahimawy
  cast: Samira Fathallah, Hassan El-Sharqawy, Nabila Zakariyya
  genre: drama
  plot: >-
    Postman Ibrahim Naguib has delivered letters by felucca along a remote stretch of the Nile for thirty
    years, and the villages treat him as a kind of living newspaper. When the ministry installs a telephone
    exchange in the nearest town and announces that his route will be abolished, he decides to make one
    last delivery of every unsent letter he has been carrying in his canvas bag. Among them are a
    forbidden love letter, an apology from a man to his estranged brother, a bank draft that has expired,
    and a child's drawing addressed to a father in Cairo who has not written back. Ibrahim sails south for
    a week, stopping at each village to deliver one letter and to witness the consequences. The apology
    reconciles two brothers who have not spoken since a land dispute, and the love letter causes a scandal
    that nearly ends in a duel. At the final village a widow tells him that the father in Cairo died years
    ago, and asks Ibrahim to read her the drawing aloud. He describes the picture as a
    child might see it, and the widow smiles. On his return, the villagers have formed a river
    cooperative to carry mail by boat, and they ask him to be its first chairman. He accepts, with his
    canvas bag held to his chest, and sails into the evening current.
    The last image is the empty felucca drifting downstream by itself, its sail catching the late light, carrying nothing but a single unopened envelope.
- year: 1975
  title: Kerosene Summer
  origin: Telugu
  director: Venkateswara Raghavapuri
  cast: Nagabhushanam Pendyala, Sarojini Devarakonda, Ramaswamy Tadepalligudem
  genre: action
  plot: >-
    In a drought-struck Andhra village, a bicycle repairman named Raju discovers that the landowner's
    kerosene tanker has been secretly siphoning water from the village well. He organises the farmers
    into a night-time convoy of bullock carts to steal the tanker and drive it to the district
    collector's office. The landowner's hired thugs pursue them across the dry riverbed in jeeps, and the
    tanker has to be refilled with water at every culvert.
- year: 2015
  title: Atlas of Lost Birthdays
  origin: South_Korean
  director: Seo Ha-neul
  cast: Yoon Chae-rin, Kwon Ji-hoon, Baek Na-ra
  genre: fantasy
  plot: >-
    Every birthday that is not celebrated disappears from the calendar and drifts to a hidden city called
    Hanyeol, where a clerk named Mira catalogues them in an enormous atlas. When a lonely thirty-year-old
    accountant, Do-yeon, discovers that her missing birthdays have been stacked on a shelf in Mira's
    archive, she travels there on the last train of a rainy night. The city is built from lost candles,
    uneaten cakes and unsent greeting cards, and it is slowly running out of space. Mira admits that no
    one has ever returned a birthday to its owner, because the rules say that each one has to be
    celebrated by a stranger before it can leave. Do-yeon sets out to collect thirty strangers willing to
    celebrate with her, beginning with a ticket inspector, a one-eyed baker and a child who has never had
    a party. Each celebration is strange and hesitant, and each gives her back a year. Along the way she
    learns that the atlas itself is made from the birthdays no one ever claimed, and that Mira is the
    first of them, the birthday of a girl who was never born. At the last party, with only Mira remaining
    on the list, Do-yeon decides to give the final year away and bake a cake for the clerk. The atlas
    opens at an empty page, and Mira walks out of the city into a morning where the calendar has quietly
    added her name.
    In the closing scene, Do-yeon finds on her own doorstep a small parcel tied with string, and inside it is a candle.
    The atlas is still there, they say, but the shelf where her years were kept has been given over to a window.
- year: 1949
  title: The Brass Band Strike
  origin: American
  director: Clarence Tolliver-Marsh
  cast: Wilhelmina Pettibone, Orrin Slocumb, Hortensia Gaskell
  genre: comedy
  plot: >-
    In 1949 the town band of Pottsville, Ohio, goes on strike two days before the Fourth of July parade,
    demanding a raise of fifteen cents per tune and a proper bandstand. The mayor, a vain man who has
    planned the parade for months, refuses to negotiate and instead recruits the volunteer fire department
    and a drum corps of Boy Scouts to take their place. The firemen can play only marching songs, and the
    scouts can play only reveille, so the rehearsal sounds like a parade of alarm clocks. Meanwhile, the
    striking musicians set up a picket line outside the town hall with a tuba and a hand-lettered banner.
    The mayor's daughter, secretly engaged to the trombonist, plays peacemaker, and becomes the first
    woman in the history of the town to conduct. At the parade the scouts march in the wrong direction,
    the firemen mistake the cue for a fire, and the strikers show up with the tuba in a pickup truck,
    playing in the opposite lane. The two bands collide at the town square in a joyful cacophony. The
    crowd cheers wildly, and the mayor, recognising a political opportunity, announces that the band has
    always deserved its raise. The tuba player is carried off on the shoulders of the fire department.
    The film ends with the whole town singing out of tune in the square, and the mayor quietly handing the conductor's baton to his daughter, who will keep it for forty years while the band plays on without a single further dispute.
    Even the striking tuba player, who never intended to settle, admits it was the best parade he ever failed to attend.
