# SYNTHETIC story motifs (part 3). See motifs_1.yaml for the format and the drawing rules.
mystery:
  - premise: "{n}, a retired piano tuner, is asked to find out why a grand piano in a country house plays one key by itself every midnight."
    obj: "the self-playing key"
    turn: "The key is wired to a hidden mechanism in the cellar, and {a}, the estate's lawyer, has been using it to signal an accomplice."
  - premise: "{n}, a village librarian, notices that a rare map has been cut from an atlas and replaced with a perfect drawing."
    obj: "the replaced map"
    turn: "The drawing was made by {a}, a respected local historian, who needed the original to prove a claim about a vanished parish."
  - premise: "{n}, a ferry stewardess, finds a passenger dead in a locked cabin with a half-eaten orange and a note reading only the word tomorrow."
    obj: "the note reading tomorrow"
    turn: "{a}, the ship's purser, has been selling tomorrow's tickets for decades, and the dead passenger discovered the fraud."
  - premise: "{n}, a lighthouse keeper's apprentice, finds a message in a bottle that describes a murder in a room {n} has never visited."
    obj: "the bottled confession"
    turn: "The room is in {a}'s home, and the bottle was thrown into the sea by the victim minutes before the crime."
  - premise: "{n}, a clockmaker, is called to repair a mantel clock that has stopped at the exact minute of a death in the household."
    obj: "the stopped mantel clock"
    turn: "{a}, the heir, set the clock to stop deliberately, and the clockmaker's expertise is the one thing that can reveal the fraud."
  - premise: "{n}, a bookbinder, is given a diary to rebind and notices the pages have been rearranged to conceal a confession."
    obj: "the rearranged diary"
    turn: "The sequence, when restored, names {a}, the diarist's closest friend, and the binder is warned to destroy the evidence."
  - premise: "{n}, an apprentice chef, is blamed when a dinner party at a manor ends with the host face down in the soup."
    obj: "the poisoned soup"
    turn: "The poison was in the bowl, not the soup, and {a}, the butler, polished it earlier in the afternoon."
  - premise: "{n}, a seaside photographer, develops a roll of film from a tourist who has disappeared and finds a figure in every frame."
    obj: "the unexplained figure in the photographs"
    turn: "The figure is {a}, a local fisherman, who appears in the background of every picture because the fisherman was following the tourist."
  - premise: "{n}, a mountain hut warden, finds a guest book in which tomorrow's date has already been signed by a hiker who has not yet arrived."
    obj: "the pre-signed guest book"
    turn: "The hiker is {a}, a missing climber, who arrives the next morning and swears nothing was ever signed."
  - premise: "{n}, a seamstress for a theatre company, discovers a costume that has been altered to hide a small, locked box."
    obj: "the costume's hidden box"
    turn: "{a}, the lead actor, knew about the box, and has been performing in the costume to protect it."
  - premise: "{n}, a night-train steward, is asked by a passenger to guard a sealed envelope that must not be opened until the train crosses the border."
    obj: "the sealed border envelope"
    turn: "The passenger vanishes at the border, and {a}, a customs officer, forces the envelope open to find a list of the train's passengers."
  - premise: "{n}, a gravedigger with an eye for handwriting, notices that the inscription on a new headstone matches a threatening letter sent to the parish."
    obj: "the matching inscription"
    turn: "The mason {a} cut both, on the orders of a parishioner who intended the headstone to be a warning."
  - premise: "{n}, a tea shop owner, receives a daily order from an address that burned down fifteen years ago."
    obj: "the phantom tea orders"
    turn: "{a}, the only survivor of the fire, has been using the orders to signal that the cause was not an accident."
  - premise: "{n}, a young bellringer, notices that the church peal rung at a funeral does not match the order printed in the service."
    obj: "the wrong peal"
    turn: "The peal is a code written by {a}, the vicar, who wants the congregation to find the coffin's real occupant."
  - premise: "{n}, a ticket collector at an old cinema, finds a reel of film that contains an unseen scene of a famous disappearance."
    obj: "the unseen reel"
    turn: "The footage shows {a}, the cinema's founder, walking into the frame and never coming out."
  - premise: "{n}, a retired schoolteacher, is invited to solve a puzzle left in a will by a student from forty years ago."
    obj: "the puzzle in the will"
    turn: "The solution is the location of {a}'s stolen inheritance, and the puzzle's author knew the teacher would be the only person to finish it."
  - premise: "{n}, a postman on a remote island, delivers a postcard with no stamp and a blank back from a town that no one has visited."
    obj: "the blank postcard"
    turn: "{a}, the island's sole resident, reads the invisible ink under a lamp and weeps."
  - premise: "{n}, an auction house porter, is the only one to notice that the catalogue illustration of a lot is subtly different from the object on the stand."
    obj: "the swapped auction lot"
    turn: "The swap was arranged by {a}, the auctioneer, to disguise a forgery as a copy of itself."
  - premise: "{n}, a river lock keeper, finds a locked suitcase caught in the gates and a trail of wet footprints leading in the wrong direction."
    obj: "the suitcase in the lock"
    turn: "The suitcase belongs to {a}, who is both the drowned man and the murderer, depending on which lock is considered first."
fantasy:
  - premise: "{n}, a mapmaker's apprentice, discovers that the ink in the master's workshop draws roads that did not exist the day before."
    obj: "the living ink"
    turn: "{a}, the master, has been drawing a path to a hidden kingdom, and the ink will only dry once the journey is completed."
  - premise: "{n}, a village baker, finds that the bread dough rises into small animals that run away at dawn."
    obj: "the dough creatures"
    turn: "{a}, a travelling witch, offers to buy the secret recipe, but the animals refuse to return to the oven."
  - premise: "{n}, a shepherd on a cloud-covered mountain, finds a sheep whose wool glows with the stories it has heard."
    obj: "the glowing sheep"
    turn: "{a}, a travelling bard, offers a fortune for a single fleece, and the sheep begins to tell the bard's own story back to the bard."
  - premise: "{n}, a lamplighter in a city where the streetlamps hold trapped spirits, accidentally releases one on a cold winter night."
    obj: "the freed lamp spirit"
    turn: "The spirit demands to be taken home, and {a}, the city's alderman, wants all the spirits returned to their lamps by dawn."
  - premise: "{n}, a young blacksmith, forges a key that does not fit any lock in the kingdom but opens a door in the air."
    obj: "the key to nowhere"
    turn: "Beyond the door is {a}, the lost queen, waiting for a key that has been missing for three hundred years."
  - premise: "{n}, a gardener in an abandoned monastery, finds a seed that grows into a tree bearing questions instead of fruit."
    obj: "the tree of questions"
    turn: "{a}, the last monk, begs the gardener to pick no more questions, because every answer will cost something."
  - premise: "{n}, a river ferryman, is asked to carry a passenger who has no weight and leaves no ripples."
    obj: "the weightless passenger"
    turn: "{a}, the passenger, is the spirit of the river itself, and wants only to be carried to the sea once more."
  - premise: "{n}, a tailor who sews coats for the wind, is commissioned by a mountain to make a garment from stone."
    obj: "the stone coat"
    turn: "{a}, the mountain's herald, warns that the coat must be finished before the thaw, or the valley will be buried."
  - premise: "{n}, a village midwife, delivers a child who is born holding a tiny, working lantern."
    obj: "the newborn's lantern"
    turn: "{a}, the lantern's maker, arrives from under the hills to claim the child as an apprentice, and the village must decide what to pay."
  - premise: "{n}, a young beekeeper, discovers that the hive makes honey that tastes of different seasons depending on who eats it."
    obj: "the seasonal honey"
    turn: "{a}, a king, requests a jar to taste a summer that was missed, and the honey gives the king what has not been earned."
  - premise: "{n}, a lighthouse keeper on an island that appears only at low tide, receives a ship that has not sunk yet."
    obj: "the island at low tide"
    turn: "{a}, the ship's captain, has come to ask the keeper to put out the light, so the wreck can be avoided, and {n} must choose."
  - premise: "{n}, a travelling cobbler, mends a pair of boots that can walk themselves home from anywhere."
    obj: "the self-walking boots"
    turn: "The boots belong to {a}, a lost prince, who has been walking toward the kingdom for years in other people's shoes."
  - premise: "{n}, a young glassblower, makes a bottle that stores a single day and releases it on request."
    obj: "the day-in-a-bottle"
    turn: "{a}, a dying neighbour, asks for the day of their wedding, and the glassblower must visit it to find out how it ended."
  - premise: "{n}, a goose girl, learns to speak the language of the wild geese, and hears them plan an uprising against the king."
    obj: "the geese uprising"
    turn: "{a}, the king, is secretly a goose, and begs the girl to translate on the king's behalf."
  - premise: "{n}, a cartwright, builds a wheel that rolls slightly into the past with each turn."
    obj: "the backward-rolling wheel"
    turn: "{a}, a widow, asks to ride the cart for one hour, to see the farm as it was before the fire."
  - premise: "{n}, an apprentice dragon-keeper, is left in charge of a hatchling that eats only songs."
    obj: "the song-eating hatchling"
    turn: "{a}, the village choirmaster, discovers that the dragon has swallowed the choir's best hymn and refuses to sing it back."
  - premise: "{n}, a market juggler, finds that each of three juggling balls holds a different small world."
    obj: "the juggling balls of worlds"
    turn: "{a}, a merchant, wants to buy one, and the juggler learns that the worlds have started to notice the juggler."
  - premise: "{n}, a young night watchman in a walled city, notices that the shadows at the gate move in the opposite direction from their owners."
    obj: "the backward shadows"
    turn: "{a}, the gate captain, has traded away a shadow for safe passage and wants it back before the festival."
  - premise: "{n}, a chimney sweep, finds a hidden room in a chimney that contains a library of unwritten books."
    obj: "the library of unwritten books"
    turn: "{a}, the librarian, is a ghost who needs a story to finish the last shelf and offers to teach the sweep to read."
animation:
  - premise: "{n}, a small hedgehog librarian, discovers that the books in the forest library have begun to rearrange themselves at night."
    obj: "the wandering books"
    turn: "{a}, a mischievous owl, claims innocence, but the books have learned to follow the owl's voice."
  - premise: "{n}, a young paper kite with a torn tail, dreams of flying across the sea to see the place where the wind is born."
    obj: "the torn-tailed kite"
    turn: "{a}, a gruff weathervane, offers directions, but warns that no kite has ever returned."
  - premise: "{n}, a brave little teapot in a seaside cafe, is accidentally shipped across the ocean in a crate of china."
    obj: "the shipped teapot"
    turn: "{a}, a lonely lighthouse, signals the way home, but only once the teapot learns the song of the tide."
  - premise: "{n}, a robot street sweeper, decides to collect all the lost buttons in the city and sort them by colour."
    obj: "the button collection"
    turn: "{a}, a tailor's cat, discovers that each button belongs to a different forgotten coat."
  - premise: "{n}, a tiny cloud who cannot rain, drifts into a drought-stricken valley."
    obj: "the dry cloud"
    turn: "{a}, an old farmer, teaches the cloud to rain by telling it a joke."
  - premise: "{n}, a clumsy clockwork mouse, escapes from a toymaker's shop to find the one who wound it up."
    obj: "the clockwork mouse's key"
    turn: "{a}, a wise old clock, reveals that the key was never lost and the mouse has been winding itself the whole time."
  - premise: "{n}, a young snail with a spiral shell shaped like a staircase, sets out to climb the tallest garden wall."
    obj: "the staircase shell"
    turn: "{a}, a patient robin, offers a lift, but the snail wants to reach the top by climbing every step."
  - premise: "{n}, a baby penguin who is afraid of water, is adopted by a family of seagulls on a faraway pier."
    obj: "the seagull family pier"
    turn: "{a}, a stormy wave, is not as terrible as it sounds, and the penguin discovers that swimming is just flying underwater."
  - premise: "{n}, a young firefly whose light has gone out, joins a travelling night circus in search of a spark."
    obj: "the dim firefly's spark"
    turn: "{a}, the ringmaster, reveals that the light was never missing, only waiting for a really dark night."
  - premise: "{n}, a sailing boat made of walnut shell, embarks on a voyage across the kitchen sink."
    obj: "the walnut-shell boat"
    turn: "{a}, a sponge pirate, offers a map, but the real treasure is the drain at the end of the journey."
  - premise: "{n}, a shy bear cub, is tasked with delivering the first snowflake to a village that has forgotten winter."
    obj: "the first snowflake"
    turn: "{a}, a grumbling mountain, refuses to let the snowflake pass until the cub has told it a lullaby."
  - premise: "{n}, a little lamp in a flea market, wishes to light a window instead of a shelf."
    obj: "the flea-market lamp"
    turn: "{a}, a lonely child, buys the lamp for a single coin, and the two light an attic until dawn."
  - premise: "{n}, a young otter apprentice, inherits a leaky rowing boat and a map of ten forgotten ponds."
    obj: "the ten ponds map"
    turn: "{a}, a tortoise navigator, points out that the tenth pond is the one the apprentice started from."
  - premise: "{n}, a playground swing, sets out to find the child who stopped coming to the park."
    obj: "the abandoned swing"
    turn: "{a}, a kindly crow, carries the swing's message to a window, and the child, now grown, comes back with a child of their own."
  - premise: "{n}, a pocket-sized dragon, accidentally burns the town's only birthday cake and sets out to bake another."
    obj: "the burnt birthday cake"
    turn: "{a}, a stern fairy baker, supplies the recipe, but demands that the dragon learn to cook without breathing fire."
  - premise: "{n}, a small fish who lives in a bowl, dreams of the ocean and begins to dig an escape tunnel through the water."
    obj: "the goldfish tunnel"
    turn: "{a}, a bowl-mate snail, points out that the bowl is the ocean as seen from the inside."
  - premise: "{n}, a paper plane folded from a love letter, is lost in the wind and must find its way back to the sender."
    obj: "the love-letter plane"
    turn: "{a}, a gust of wind, agrees to carry the plane if it promises to forget the last line."
  - premise: "{n}, a tin whistle at the bottom of a toy chest, hears the first note of a song from a distant room."
    obj: "the lone whistle's song"
    turn: "{a}, a drum, joins in from a different box, and the entire toy chest forms a band."
  - premise: "{n}, a young badger who hates mornings, is appointed the keeper of the sunrise for a single day."
    obj: "the sunrise keeper's bell"
    turn: "{a}, the sleepy sun, is reluctant to rise and requires a special song only the badger knows."
film noir:
  - premise: "{n}, a disgraced newspaper photographer, is paid to take pictures of an empty hotel room and discovers someone moved the furniture."
    obj: "the empty hotel room"
    turn: "{a}, the client, wants the photographs to prove the room was never occupied, and has a gun to prove the point."
  - premise: "{n}, a jazz bassist with a gambling problem, is asked to play at a funeral for a man who is still sitting in the front pew."
    obj: "the funeral for the living"
    turn: "{a}, the supposed corpse, has staged a death to flush out a partner, and needs the bassist to keep playing."
  - premise: "{n}, a dockside bookkeeper, finds a ledger in which every entry is a name followed by the date of that person's death."
    obj: "the ledger of deaths"
    turn: "The last entry is {n}'s own, and {a}, the shipping boss, advises the bookkeeper to avoid the dates."
  - premise: "{n}, a night-club coat check attendant, is handed a coat with a pistol in the pocket and a ticket stub for a train that left yesterday."
    obj: "the coat with the pistol"
    turn: "The coat's owner, {a}, is the city's missing councillor, and the pistol is the one that killed the councillor's partner."
  - premise: "{n}, a pawnbroker in a fog-bound waterfront district, accepts a wedding ring that has dried blood on its inner band."
    obj: "the bloodied wedding ring"
    turn: "{a}, the redeemer, arrives with the pawn ticket and a story about the ring that does not match the evidence."
  - premise: "{n}, a private detective who can no longer afford an office, is hired by a woman to follow her own shadow."
    obj: "the woman's shadow"
    turn: "{a}, the client, is being followed by someone who casts no shadow at all, and wants to know who it is."
  - premise: "{n}, a streetcar conductor, finds a briefcase of cash under a seat and a gun clipped beneath the next."
    obj: "the streetcar briefcase"
    turn: "{a}, the passenger who left it, rides the same line every night, waiting for someone to ask the right question."
  - premise: "{n}, a retired boxer working as a bouncer, is asked to remove a patron who has been sitting at the same table for three nights."
    obj: "the patron at table nine"
    turn: "{a}, the patron, is a witness in protective custody, and the nightclub is the only place the killers have not yet looked."
  - premise: "{n}, a coroner's assistant, notices that the body on the table was embalmed before the time of death in the report."
    obj: "the pre-embalmed body"
    turn: "{a}, the coroner, signed both documents under duress, and slides a key across the desk."
  - premise: "{n}, a radio detective-show actor, receives a threatening letter written in the exact words of a script that was never broadcast."
    obj: "the unbroadcast script"
    turn: "{a}, the writer, is dead, and the script's last page reveals a murder that has not yet happened."
  - premise: "{n}, a hotel telephone operator, overhears a call arranging a death at the stroke of midnight and realises it is tonight."
    obj: "the overheard midnight call"
    turn: "The target is {a}, the hotel's owner, who has been sleeping in a different room every night of the week."
  - premise: "{n}, a window dresser at a department store, stages a mannequin scene that mirrors a crime the police have not discovered."
    obj: "the window display crime"
    turn: "{a}, a detective, stops outside the window each day, and eventually asks to see the mannequin's pockets."
  - premise: "{n}, a union organiser in a waterfront bar, is slipped a matchbook with an address and a warning not to be late."
    obj: "the matchbook address"
    turn: "The address is the union hall, and {a}, the treasurer, is waiting inside with the strike fund and a suitcase."
  - premise: "{n}, a typist in a lawyer's office, finds that the lawyer's confidential files include a set of photographs of the typist's own apartment."
    obj: "the apartment photographs"
    turn: "{a}, the lawyer, explains that the pictures were taken to protect the typist, and that the real watcher is across the street."
  - premise: "{n}, a ferry bartender, mixes a drink for a passenger who orders the same cocktail as a woman who disappeared overboard last winter."
    obj: "the cocktail of the vanished"
    turn: "{a}, the passenger, is the missing woman's twin, and wants to know who shared the last glass."
  - premise: "{n}, a lighthouse mechanic, is paid in cash to shut off the beam for exactly four minutes on a foggy night."
    obj: "the four dark minutes"
    turn: "{a}, the client, is landing a boat on the rocks, and the mechanic must decide who gets to survive the next storm."
  - premise: "{n}, a failed novelist working as a ghostwriter for a crime boss, is asked to write the boss's confession."
    obj: "the ghostwritten confession"
    turn: "Every chapter incriminates {a}, the boss's lieutenant, and the writer realises the book is intended as a weapon."
  - premise: "{n}, a nightclub cigarette girl, discovers that a rival gang is using the tray to pass messages."
    obj: "the cigarette tray messages"
    turn: "{a}, the club owner, learns the code and tells the girl to keep delivering, and to start inventing new messages."
  - premise: "{n}, a night-shift elevator operator in a skyscraper, takes a mysterious passenger to a floor that does not exist."
    obj: "the thirteenth-floor passenger"
    turn: "The doors open on {a}'s office, set exactly as it was on the day of an unsolved fire."
