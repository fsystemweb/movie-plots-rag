# Central tunables, loaded by src/movie_rag/config.py (pydantic-settings). Never hard-code these in src/.
# Precedence (highest first): init kwargs, environment variables, .env, this file.
#   - Nested keys can be overridden with a double underscore, e.g. LLM__CHAT_MODEL=...
#   - A few well-known variables are applied on top: QDRANT_URL, NEBIUS_BASE_URL, MCP_URL, LANGSMITH_PROJECT.
# Secrets (API keys) never live here: they come from the environment only (see .env.example).
qdrant:
  url: http://localhost:6333
  collection: movie_plots
  timeout_s: 60   # client-side timeout for every Qdrant call

embeddings:
  dense_model: BAAI/bge-small-en-v1.5
  dense_dim: 384
  sparse_model: Qdrant/bm25

ingest:
  chunk_tokens: 250
  chunk_overlap: 40
  batch_size: 256
  min_plot_words: 50   # plots shorter than this are dropped by cleaning
  random_seed: 42      # every sampling step (eval set, demo picks) uses this seed

retrieval:
  default_mode: hybrid   # dense | sparse | hybrid
  top_k: 8
  prefetch_limit: 50
  snippet_max_chars: 400
  demo_query: a hotel telephone operator overhears a call arranging a death at midnight   # `make demo` sample query

llm:
  base_url: https://api.tokenfactory.nebius.com/v1/
  chat_model: Qwen/Qwen3-30B-A3B-Instruct-2507
  judge_model: openai/gpt-oss-120b
  temperature: 0
  max_tool_calls: 4

mcp:
  url: http://localhost:8000/mcp   # where clients (agent, UI) reach the server; keep host/port/path below consistent
  host: 127.0.0.1                  # bind address; the Docker service overrides it with MCP__HOST=0.0.0.0
  port: 8000
  path: /mcp                       # streamable-HTTP endpoint
  health_path: /health             # liveness probe for the Docker healthcheck
  min_query_chars: 2
  max_query_chars: 1000
  max_top_k: 20                    # upper bound of the top_k argument of search_movies / find_similar
  max_filter_values: 200           # list_filters returns at most this many genres / origins (most frequent first)
  title_lookup_limit: 10           # films returned when an exact title is ambiguous
  healthcheck_timeout_s: 3

agent:
  prompt_version: system_v1
  max_citations: 5   # films cited per answer (the prompt asks for at most this many)
  mcp_timeout_s: 30  # HTTP timeout of the agent's MCP connection (per request)

ui:
  title: Movie Plots RAG
  mcp_timeout_s: 30   # HTTP timeout of the page's own MCP connection (retrieval-only mode, filters, compare tab)
  example_questions:  # the four buttons above the chat input
    - a hotel telephone operator overhears a call arranging a death at midnight
    - an engineer on a colony ship discovers an unknown language hidden in the water supply
    - a murder seen through a glass wall by a window cleaner, 1990s thriller
    - a talking dinosaur runs for president of Mars

observability:
  project: movie-plots-rag
  langsmith_api_url: https://api.smith.langchain.com
  git_timeout_s: 5

data:
  dataset_slug: jrobischon/wikipedia-movie-plots
  kaggle_api_url: https://www.kaggle.com/api/v1
  kaggle_token_help_url: https://www.kaggle.com/settings
  raw_dir: data/raw
  csv_name: wiki_movie_plots_deduped.csv
  fixture_path: tests/fixtures/movies_sample.csv
  max_download_mb: 200
  max_extracted_mb: 1000   # cap on the unzipped CSV, counted while writing (zip-bomb guard)
  http_timeout_s: 60

eval:
  questions_path: src/movie_rag/eval/data/questions_v1.jsonl            # 40 questions, 10 per type (docs/EVAL_SET.md)
  generated_path: src/movie_rag/eval/data/questions_v1_generated.jsonl  # output of the paraphrase generator (needs a key)
  per_type: 10
  ngram_size: 4                       # overlap guard: no shared run of this many words between a fuzzy question and its plot
  paraphrase_prompt_version: paraphrase_v1
  generate_count: 10                  # fuzzy questions per generator run (sampled with ingest.random_seed)
  max_attempts: 3                     # model calls per film before it is rejected and the next sampled film is tried
  dataset_name: movie-plots-questions-v1   # LangSmith dataset (bump the suffix when the question set changes)

doctor:
  http_timeout_s: 5
  docker_timeout_s: 10
